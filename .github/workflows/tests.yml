name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests run in lite mode, so the large AI packages are skipped.
      - run: pip install gradio feedparser requests pyyaml plotly pytest
      - run: pytest -q
        env:
          BRAND_INTEL_LITE: "1"
