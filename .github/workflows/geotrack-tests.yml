name: GeoTrack tests

on:
  pull_request:
    paths: ["geotrack/**", "tests/test_geotrack.py", ".github/workflows/geotrack-tests.yml"]
  push:
    branches: [main]
    paths: ["geotrack/**", "tests/test_geotrack.py", ".github/workflows/geotrack-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: geotrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r geotrack/requirements.txt pytest httpx
      - run: pytest -q tests/test_geotrack.py
        env:
          GEOTRACK_TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/geotrack_test
