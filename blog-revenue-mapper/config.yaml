# Blog Revenue Mapper — configuration
# Phase 0 (collect + score) reads everything below. No writes to the store.

sheet:
  # Canes Galore reports sheet, populated by the Monday Apps Script.
  id: "1fYhCKWa8ES09ATPrnhgLtISJJwFiiDFId1AYE18_Lcc"
  # Tabs are located by header signature, not by name, because the Apps Script
  # has renamed tabs before. See scripts/lib_sheet.py: TAB_SIGNATURES.
  tabs:
    ga_landing: "GA_Landing"
    gsc_queries: "GSC_Queries"
    gsc_pages: "GSC_Pages"
    scorecard: "Scorecard"

store:
  domain: "www.canesgalore.com"
  blog_handle: "news"
  blog_path_prefix: "/blogs/news/"
  # Inventory location that represents real sellable stock.
  # "Missouri Returns" is an address, not stock — never count it.
  sellable_location: "Collins Place"
  ignore_locations: ["Missouri Returns"]

backfill:
  # The 28-day window was the Apps Script's date range, not a data limit.
  # Search Console retains ~16 months and the GA4 property has full history.
  #   scripts/lib_gsc.py  pulls query x page straight from the Search Console
  #                       API over any window, which is the join the reports
  #                       sheet does not have.
  #   Shopify sessions    pulled by landing page over 90 days via ShopifyQL.
  # score.py uses both automatically when their files exist under data/tabs/.
  gsc_query_page: "data/tabs/gsc_query_page.csv"
  shopify_sessions_90d: "data/tabs/shopify_sessions_90d.csv"
  shopify_sessions_28d: "data/tabs/shopify_sessions_28d.csv"
  days: 90
  gsc_lag_days: 3

window:
  # The reports sheet is a trailing 28-day window with a 3-day GSC lag.
  # The spec was written assuming 90 days; it is not. Column names use _28d.
  days: 28
  label: "28d"
  # Last day of the reporting window, read from the Scorecard tab when
  # present. An article edited after this date is not measured by this data.
  ends: "2026-09-05"

scoring:
  # A query at position 5-20 is "striking distance". The sheet already
  # classifies this in GSC_Queries.bucket; we reuse that and only fall back
  # to the position range when the bucket column is absent.
  striking_distance_min_position: 5
  striking_distance_max_position: 20
  # Minimum sessions for a blog URL to be considered at all.
  min_sessions: 25
  # What counts as "already has a product path", and so is filtered out of
  # candidates.csv by default.
  #   shop_block  only a cg-shop-block product module counts
  #   any_link    a /products/ or /collections/ link anywhere also counts
  # Posts carrying a lone collection link in prose converted at 0.08% in the
  # last window, so a link in prose is not treated as a product path.
  existing_path_signal: "shop_block"
  # A page needs at least this many attributed queries for its intent score
  # to be treated as well-supported.
  min_intent_query_support: 3
  top_n: 20

output:
  candidates_csv: "out/candidates.csv"
  baseline_json: "out/baseline.json"
